[project]
name = "soundweave"
version = "0.1.0"
description = "Random soundtrack selector and YouTube video generator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
soundweave = "soundweave.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE001 (blind except Exception) and S110 (except-pass without logging) are
# disabled project-wide: every current site is either a top-level CLI/pipeline
# error boundary that must catch anything to guarantee an exit code, or a
# deliberate best-effort side operation (disk-space estimate, FFmpeg version
# string, per-track duration probe) that should degrade rather than crash the
# run. Narrowing these would break the documented exit-code contract in
# docs/ARCHITECTURE.md, not improve it.
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
